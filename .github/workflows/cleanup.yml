---
name: Cleanup for Docker temporary images

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Delete old CI images
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          image-names: wordpress-soap
          image-tags: "ci-*"
          cut-off: 7d
          account: user
          token: ${{ secrets.PACKAGES_CLEANUP_PAT }}
